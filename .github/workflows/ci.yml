name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  architecture:
    name: Architecture (ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: ArchUnit tests
        run: ./gradlew :domain:test --tests '*ArchitectureTest*' :application:test --tests '*ArchitectureTest*' --info
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: '**/build/reports/tests/test/'

  test:
    name: Test (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run all tests
        run: ./gradlew test --info
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test/'

  build:
    name: Build (bootJar)
    runs-on: ubuntu-latest
    needs: [architecture, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build bootJar
        run: ./gradlew :api:bootJar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: twinface-jar
          path: api/build/libs/*.jar
