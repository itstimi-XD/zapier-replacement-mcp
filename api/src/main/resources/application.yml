spring:
  application:
    name: zapier-replacement-mcp
  # No Postgres adapter exists yet, so skip the database
  # autoconfiguration that the data-jpa starter on the classpath would
  # otherwise trigger (it fails boot with "Failed to configure a
  # DataSource"). REMOVE this block when the first Postgres adapter
  # (JPA entity / repository) lands, and configure spring.datasource.*.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    mcp:
      server:
        name: twinface
        version: 0.0.1-SNAPSHOT
        # Default SSE endpoint is /sse and message endpoint is /mcp/message
        # under the Spring Boot app's port. Override via
        # spring.ai.mcp.server.sse-endpoint / sse-message-endpoint if
        # an MCP client expects different paths.

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Single-tenant default for the self-hosted reference deployment.
# Override via env TWINFACE_WORKSPACE_ID=... on a hosted instance.
twinface:
  workspace:
    id: default
  slack:
    enabled: false
    base-url: https://slack.com/api
